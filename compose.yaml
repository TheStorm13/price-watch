name: price-analyzer

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-price_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-price_analyzer}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      target: api
    command: ["python", "main.py", "db", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-price_analyzer}:${POSTGRES_PASSWORD:-price_analyzer}@db:5432/${POSTGRES_DB:-price_analyzer}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: .
      target: api
    command: ["python", "main.py", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-price_analyzer}:${POSTGRES_PASSWORD:-price_analyzer}@db:5432/${POSTGRES_DB:-price_analyzer}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-price_analyzer}:${POSTGRES_PASSWORD:-price_analyzer}@db:5432/${POSTGRES_DB:-price_analyzer}
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    volumes:
      - playwright_profile:/app/.playwright-profile
    shm_size: 1gb
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  logs:
    image: amir20/dozzle:latest
    logging: *default-logging
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=price-analyzer
      DOZZLE_HOSTNAME: price-analyzer
    ports:
      - "127.0.0.1:${LOGS_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  desktop-worker-logs:
    image: busybox:1.37
    command: ["tail", "-n", "100", "-f", "/logs/desktop-worker.log"]
    volumes:
      - ./output:/logs:ro
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  playwright_profile:
  dozzle_data:
