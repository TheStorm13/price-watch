[package]
name = "price-watch"
version = "0.1.5"
description = "Desktop shell for price-watch"
authors = ["price-watch"]
edition = "2021"
rust-version = "1.77.2"
default-run = "price-watch"

[lib]
name = "price_watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
dotenvy = "0.15.7"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"
