[package]
name = "price-watch-desktop"
version = "0.1.3"
description = "Desktop shell for Marketplace Price Analyzer"
authors = ["Price Watch"]
edition = "2021"
rust-version = "1.77.2"
default-run = "price-watch-desktop"

[lib]
name = "price_watch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dotenvy = "0.15"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-opener = "2"
