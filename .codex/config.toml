sandbox_mode = "danger-full-access"
approval_policy = "never"

[features]
multi_agent = false

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
cwd = "/home/ilya-groza/DevProjects/price-watch"

[mcp_servers.repowise]
command = "repowise"
args = ["mcp", "--tools", "get_overview,get_context,get_risk,get_change_risk,get_why,get_dead_code,get_health"]
cwd = "/home/ilya-groza/DevProjects/price-watch"
